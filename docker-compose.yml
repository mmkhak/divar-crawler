services:
  panel:
    build: .
    ports:
      - "8000:8000"   # پنل
      - "6080:6080"   # noVNC برای لاگین Chromium
    environment:
      ENABLE_VNC: "1"
      BROWSER_HEADLESS: "0"
      DISPLAY: ":99"
      DATA_DIR: /app/data
      PORT: "8000"
      VNC_URL: "https://divar2.pixlink.ir/vnc.html"
      PANEL_URL: "https://divar.pixlink.ir/"
      # TELEGRAM_BOT_TOKEN: "123:ABC"
      # TELEGRAM_CHAT_ID: "123456789"
    volumes:
      - divar-data:/app/data
    restart: unless-stopped

volumes:
  divar-data:
